[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyplaypen-sandbox"
version = "0.2.0"
description = "One-shot subprocess sandbox for running Python inside a container: process-group isolation, POSIX rlimits, UID drop, bounded I/O, artifact capture."
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Paul Eipper", email = "paul@redevistorias.com.br"}]
keywords = ["sandbox", "subprocess", "rlimit", "isolation", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]
dependencies = []

[project.urls]
Homepage = "https://lkraider.github.io/pyplaypen-sandbox/"
Repository = "https://github.com/lkraider/pyplaypen-sandbox"
Issues = "https://github.com/lkraider/pyplaypen-sandbox/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.24"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["linux: requires Linux-specific rlimit/uid semantics"]
