name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --target test --build-arg PYTHON_VERSION=${{ matrix.python-version }} -t pyplaypen-test .
      # Root exercises the UID drop, root-bound RLIMIT_NPROC, and ownership
      # restore; the dedicated UID exercises RLIMIT_AS and the unprivileged
      # branch. Neither runs on the ambient GitHub runner or on macOS.
      - name: Test as root
        run: docker run --rm --user root pyplaypen-test pytest -q
      - name: Test as dedicated non-root UID with a container pids cap
        run: docker run --rm --user 10001:10001 --pids-limit 512 pyplaypen-test pytest -q
      # The enforcement gate and map are deployment-shape-specific, so prove
      # them against real containers rather than only monkeypatched units.
      - name: Enforcement is honest and the gate fires
        run: |
          set -euo pipefail
          # root: process_count enforced at the caller's value
          docker run --rm --user root pyplaypen-test python -c \
            "from pyplaypen_sandbox import Sandbox; assert Sandbox(self_check=False).enforcement['process_count']=='hard_per_user'"
          # non-root + pids cap: container-enforced; gate passes with no warn_only
          docker run --rm --user 10001:10001 --pids-limit 512 pyplaypen-test python -c \
            "from pyplaypen_sandbox import Sandbox; assert Sandbox(self_check=False).enforcement['process_count']=='container'"
          # non-root, unsupported process_count: the gate must refuse. The
          # hosted runner's systemd stamps a finite DefaultTasksMax onto every
          # container's pids.max, so a truly uncapped container is impossible
          # here (even with --pids-limit=-1). Present pids.max=max — exactly
          # what a genuinely uncapped cgroup shows — so the real
          # _cgroup_pids_capped -> _enforcement_map -> gate chain runs
          # end-to-end rather than being faked by a monkeypatch.
          printf 'max\n' > /tmp/pidsmax
          if docker run --rm --user 10001:10001 -v /tmp/pidsmax:/sys/fs/cgroup/pids.max:ro pyplaypen-test python -c \
            "from pyplaypen_sandbox import Sandbox; Sandbox(self_check=False)"; then
            echo "expected the enforcement gate to reject an uncapped non-root container" >&2
            exit 1
          fi
          # ...and warn_only=True proceeds anyway, honestly reporting unsupported
          docker run --rm --user 10001:10001 -v /tmp/pidsmax:/sys/fs/cgroup/pids.max:ro pyplaypen-test python -c \
            "from pyplaypen_sandbox import Sandbox; assert Sandbox(self_check=False, warn_only=True).enforcement['process_count']=='unsupported'"

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Enforcement is honest on macOS
        run: |
          python -c "from pyplaypen_sandbox import Sandbox; e=Sandbox(self_check=False).enforcement; \
          assert e['cpu_seconds']=='hard_per_process' and e['open_files']=='hard', e; \
          assert e['memory_bytes']=='unsupported' and e['process_count']=='unsupported', e"
